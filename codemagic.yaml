workflows:
  ios-testflight:
    name: iTaaleem iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: itaaleem

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itaaleem.app
      vars:
        APP_STORE_APPLE_ID: "6820105054"
        BUNDLE_ID: com.itaaleem.app

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
