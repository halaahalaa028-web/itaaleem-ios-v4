name: itaaleem
description: "منصة أونلاين — تعليم بلا حدود."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# In iOS, build-name is used as CFBundleShortVersionString while build-number
# is used as CFBundleVersion.
version: 3.2.0+54

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to the application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  youtube_explode_dart: ^3.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  connectivity_plus: ^7.3.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  cached_network_image: ^3.4.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.3
  screen_brightness: ^2.1.11
  volume_controller: ^3.5.0
  wakelock_plus: ^1.6.1
  media_kit_libs_ios_video: ^1.1.4
  encrypt: ^5.0.3
  path: ^1.9.1
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_local_notifications: ^22.3.1
  pdfrx: ^2.4.8
  chewie: 1.8.5
  video_player: 2.9.2
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  play_install_referrer: ^0.5.0
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good practices and maintain consistent style.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.23.1
  build_runner: ^2.15.1

# assets/icon/app_icon.png is full-bleed square with no adaptive-icon
# safe-zone padding built in — run `dart run flutter_launcher_icons` after
# any change to regenerate every android/mipmap-* and ios/AppIcon.appiconset
# entry.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/images/splash_logo.png

  fonts:
    # The smart UI's font (SIL OFL, assets/fonts/OFL.txt), entry screens.
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
